<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26262e"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ff5e2e"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- anneau d'objectif (≈78 %) : cercle r=330, circonférence ≈ 2073 -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="64"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="url(#or)" stroke-width="64" stroke-linecap="round"
          stroke-dasharray="1617 2073" transform="rotate(-90 512 512)"/>
  <!-- repère « rythme idéal » -->
  <line x1="512" y1="140" x2="512" y2="214" stroke="#ffffff" stroke-width="16" stroke-linecap="round" transform="rotate(54 512 512)"/>
  <!-- W = pas qui s'enchaînent -->
  <path d="M352 420 L432 628 L512 480 L592 628 L672 420" fill="none" stroke="#ffffff" stroke-width="58"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
